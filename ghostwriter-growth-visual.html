00<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostwriter Growth Visual - LinkedIn Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }
        
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #000000 0%, #001a1f 20%, #003d47 50%, #001a1f 80%, #000000 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 60px 40px 300px; /* Left padding to avoid profile picture area */
            overflow: visible;
            box-shadow: 0 0 80px rgba(0, 217, 255, 0.2), inset 0 0 100px rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.1);
        }
        
        /* Animated background effects */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 50%, rgba(0, 217, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 50%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .banner::after {
            display: none;
        }
        
        /* Profile picture safe area indicator (for reference, can be removed) */
        .safe-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 250px;
            height: 250px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: none; /* Hidden by default, set to block to see safe area */
        }
        
        /* Ensure content doesn't overlap with profile picture */
        @media (min-width: 1584px) {
            .content-section {
                margin-left: 0;
            }
        }
        
        /* Featured Button - Top Left Corner */
        .featured-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 24px;
            border: 2px solid #00d9ff;
            background: rgba(0, 0, 0, 0.6);
            color: #00ffff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.4), inset 0 0 20px rgba(0, 217, 255, 0.1);
            z-index: 3;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }
        
        .featured-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00ffff;
            color: #ffffff;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6), inset 0 0 30px rgba(0, 217, 255, 0.2);
            transform: translateY(-2px);
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.9);
        }
        
        .featured-btn:active {
            transform: translateY(0);
        }
        
        /* Content Section - Centered in banner */
        .content-section {
            flex: 0 0 auto;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-left: 0;
            padding-top: 0;
            margin: 0 0 0 240px;
            max-width: 680px;
            align-self: center;
            width: 100%;
            justify-content: center;
        }
        
        .main-heading {
            margin-bottom: 0;
            padding-top: 0;
        }
        
        /* Main Heading */
        .heading-title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            margin: 0;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
            font-family: 'Inter', sans-serif;
        }
        
        .heading-line {
            color: #ffffff;
            display: block;
            width: 100%;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 2px 8px rgba(0, 0, 0, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        /* Biggest - Top of pyramid (Largest) */
        .heading-line:first-child {
            font-size: 60px;
            font-weight: 900;
            margin-bottom: 0;
            margin-top: 0;
            letter-spacing: -1px;
            line-height: 1.1;
            animation: fadeInUp 0.8s ease-out 0.1s both;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 3px 10px rgba(0, 0, 0, 0.7), 3px 3px 6px rgba(0, 0, 0, 0.9);
        }
        
        /* Medium - Middle of pyramid */
        .heading-line.highlighted {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff 0%, #00d9ff 50%, #00b8d9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 0;
            border-radius: 0;
            display: block;
            width: 100%;
            margin: 0;
            box-shadow: none;
            border: none;
            letter-spacing: -1px;
            line-height: 1.1;
            position: relative;
            overflow: visible;
            filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.8)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.8));
            animation: fadeInUp 0.8s ease-out 0.2s both, glowPulse 3s ease-in-out infinite 1s;
        }
        
        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.8)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.8)); }
            50% { filter: drop-shadow(0 0 25px rgba(0, 217, 255, 1)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.8)); }
        }
        
        .heading-line.highlighted::before {
            display: none;
        }
        
        /* Smallest - Bottom of pyramid */
        .heading-line:last-child {
            font-size: 42px;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 0;
            letter-spacing: -1px;
            line-height: 1.1;
            opacity: 1;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 3px 10px rgba(0, 0, 0, 0.7), 3px 3px 6px rgba(0, 0, 0, 0.9);
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Services Wrapper - Unified Section */
        .services-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 0;
            padding: 0;
            background: transparent;
            border-radius: 0;
            border: none;
            box-shadow: none;
            width: 100%;
            max-width: 100%;
            backdrop-filter: none;
            position: relative;
            overflow: visible;
            gap: 20px;
        }
        
        .services-wrapper::before {
            display: none;
        }
        
        /* Service Buttons */
        .services {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 0;
            justify-content: flex-start;
            width: 100%;
        }
        
        .service-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, #00d9ff 0%, #00b8d9 100%);
            color: #000000;
            font-size: 14px;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3), 0 0 0 0 rgba(0, 217, 255, 0);
            position: relative;
            overflow: visible;
            flex: 0 0 auto;
        }
        
        .service-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #00e5ff 0%, #00c9e8 100%);
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        
        .service-btn:hover {
            background: linear-gradient(135deg, #00e5ff 0%, #00c9e8 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 217, 255, 0.5), 0 0 0 4px rgba(0, 217, 255, 0.1);
        }
        
        .service-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.4);
        }
        
        /* Social Proof Section - Part of Services Wrapper */
        .social-proof {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 0;
            padding-top: 0;
            border-top: none;
            align-items: flex-start;
            text-align: left;
            width: 100%;
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 18px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .social-proof::before {
            display: none;
        }
        
        .trusted-by {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            margin: 0;
            letter-spacing: 0.4px;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0, 0, 0, 0.6);
        }
        
        .trusted-by .highlight,
        .impressions-text .highlight {
            color: #00ffff;
            font-weight: 900;
            font-size: 18px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 10px rgba(0, 255, 255, 0.6), 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        
        .impressions {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            margin: 0;
        }
        
        .impressions-text {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.4px;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0, 0, 0, 0.6);
        }
        
        .x-logo {
            width: 24px;
            height: 24px;
            background: #ffffff;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #000000;
            margin-left: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 3px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .x-logo:hover {
            transform: scale(1.2) rotate(5deg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 5px 15px rgba(0, 0, 0, 0.6);
        }
        
        /* Right Visual Section - Diagrams */
        .visual-section {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            right: 50px;
            z-index: 2;
            padding-left: 0;
            padding-top: 0;
        }
        
        .visual-container {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        
        .graph-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.1) 0%, rgba(0, 217, 255, 0.05) 100%);
            border: 2px solid rgba(0, 217, 255, 0.4);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.2), inset 0 0 30px rgba(0, 217, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .graph-wrapper:hover {
            border-color: rgba(0, 217, 255, 0.7);
            box-shadow: 0 8px 30px rgba(0, 217, 255, 0.4), inset 0 0 40px rgba(0, 217, 255, 0.1);
            transform: translateY(-4px) scale(1.02);
        }
        
        .graph-wrapper.complex {
            border-color: rgba(255, 68, 68, 0.3);
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.08) 0%, rgba(255, 68, 68, 0.03) 100%);
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.15), inset 0 0 30px rgba(255, 68, 68, 0.05);
        }
        
        .graph-wrapper.complex:hover {
            border-color: rgba(255, 68, 68, 0.5);
            box-shadow: 0 8px 30px rgba(255, 68, 68, 0.3), inset 0 0 40px rgba(255, 68, 68, 0.1);
            transform: translateY(-4px) scale(1.02);
        }
        
        .graph-figure {
            position: relative;
            margin: 0;
        }
        
        .graph-label {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 3px 10px rgba(0, 0, 0, 0.7);
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }
        
        .icon-error {
            color: #ff4444;
            filter: drop-shadow(0 0 8px rgba(255, 68, 68, 0.9)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
            font-size: 16px;
        }
        
        .icon-success {
            color: #00ff88;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.9)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
            font-size: 16px;
        }
        
        .graph-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .axis {
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
            opacity: 0.9;
        }
        
        .arrow {
            fill: #ffffff;
            opacity: 0.9;
        }
        
        .complex-path {
            fill: none;
            stroke: rgba(255, 85, 85, 0.8);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px rgba(255, 85, 85, 0.4));
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 2.5s ease-out forwards;
        }
        
        .simple-path {
            fill: none;
            stroke: url(#tealGradient);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(0, 217, 255, 0.6));
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 2.5s ease-out 0.5s forwards;
        }
        
        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        .start-point {
            fill: #90ee90;
            stroke: #ffffff;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 6px rgba(144, 238, 144, 0.6));
            animation: pulseDot 2s ease-in-out infinite;
        }
        
        .end-point {
            fill: #00d9ff;
            stroke: #ffffff;
            stroke-width: 3;
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.8));
            animation: pulseDot 2s ease-in-out infinite 0.5s;
        }
        
        @keyframes pulseDot {
            0%, 100% { 
                transform: scale(1);
                opacity: 1; 
            }
            50% { 
                transform: scale(1.3);
                opacity: 0.8; 
            }
        }
        
        .arrow-divider {
            font-size: 36px;
            color: #00d9ff;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.4));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: arrowPulse 2s ease-in-out infinite;
        }
        
        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0) scale(1); }
            50% { transform: translateX(4px) scale(1.1); }
        }
        
        .arrow-divider:hover {
            transform: translateX(8px) scale(1.15);
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.8);
        }
        
        /* Download button */
        .download-section {
            text-align: center;
            margin-top: 30px;
            width: 100%;
            max-width: 1584px;
            padding: 0 20px;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #00d9ff 0%, #00b8d9 100%);
            color: #000000;
            border: none;
            padding: 14px 32px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.4);
            text-transform: uppercase;
            white-space: nowrap;
            min-width: 180px;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 217, 255, 0.6);
            background: linear-gradient(135deg, #00e5ff 0%, #00c9e8 100%);
        }
        
        @media (max-width: 1700px) {
            .banner {
                width: 100%;
                max-width: 1584px;
                height: auto;
                min-height: 396px;
                aspect-ratio: 4 / 1;
            }
        }
        
        @media (max-width: 1200px) {
            .banner {
                flex-direction: column;
                padding: 30px 20px;
                gap: 30px;
                height: auto;
            }
            
            .content-section {
                flex: 1;
                text-align: center;
                padding-left: 0;
                padding-top: 60px;
            }
            
            .featured-btn {
                position: relative;
                top: 0;
                left: 0;
                align-self: flex-start;
            }
            
            .heading-line {
                font-size: 28px;
            }
            
            .visual-section {
                padding-left: 0;
                padding-top: 0;
            }
            
            .graph-wrapper {
                width: 200px;
                height: 200px;
            }
        }
        
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .banner {
                width: 100%;
                max-width: 100%;
                height: auto;
                min-height: auto;
                padding: 20px 15px;
                flex-direction: column;
                gap: 20px;
            }
            
            .featured-btn {
                position: relative;
                top: 0;
                left: 0;
                align-self: flex-start;
                font-size: 10px;
                padding: 6px 16px;
                margin-bottom: 10px;
                margin-left: 20px;
            }
            
            .content-section {
                flex: 1;
                width: 100%;
                padding-left: 20px;
                padding-right: 15px;
                padding-top: 0;
                text-align: left;
                gap: 0;
            }
            
            .heading-title {
                gap: 0;
                line-height: 1.2;
            }
            
            .heading-line:first-child {
                font-size: 28px;
                margin-bottom: 8px;
                letter-spacing: -0.8px;
            }
            
            .heading-line.highlighted {
                font-size: 20px;
                padding: 6px 14px;
                margin: 5px 0 8px 0;
                letter-spacing: -0.3px;
            }
            
            .heading-line:last-child {
                font-size: 16px;
                margin-top: 3px;
                letter-spacing: -0.2px;
            }
            
            .main-heading {
                margin-bottom: 0;
            }
            
            .services-wrapper {
                margin-top: 14px;
                padding: 18px 14px;
                max-width: 100%;
            }
            
            .services {
                gap: 12px;
                margin: 0;
            }
            
            .service-btn {
                padding: 10px 20px;
                font-size: 11px;
                flex: 1 1 auto;
                min-width: 140px;
            }
            
            .social-proof {
                gap: 8px;
                margin-top: 16px;
                padding-top: 16px;
            }
            
            .trusted-by {
                font-size: 11px;
            }
            
            .impressions-text {
                font-size: 11px;
            }
            
            .x-logo {
                width: 16px;
                height: 16px;
                font-size: 10px;
            }
            
            .visual-section {
                width: 100%;
                padding-left: 0;
                padding-top: 0;
            }
            
            .visual-container {
                flex-direction: column;
                gap: 15px;
                width: 100%;
            }
            
            .graph-wrapper {
                width: 160px;
                height: 160px;
                padding: 12px;
            }
            
            .graph-label {
                font-size: 8px;
                top: -20px;
                letter-spacing: 0.5px;
            }
            
            .arrow-divider {
                font-size: 24px;
                transform: rotate(90deg);
                margin: 5px 0;
            }
        }
        
        @media (max-width: 480px) {
            .banner {
                padding: 15px 12px;
                gap: 15px;
            }
            
            .featured-btn {
                margin-left: 16px;
            }
            
            .content-section {
                padding-left: 16px;
                padding-right: 12px;
            }
            
            .heading-title {
                gap: 0;
            }
            
            .heading-line:first-child {
                font-size: 24px;
                margin-bottom: 6px;
                letter-spacing: -0.6px;
            }
            
            .heading-line.highlighted {
                font-size: 18px;
                padding: 5px 12px;
                margin: 4px 0 6px 0;
                letter-spacing: -0.2px;
            }
            
            .heading-line:last-child {
                font-size: 14px;
                margin-top: 2px;
                letter-spacing: -0.1px;
            }
            
            .services-wrapper {
                padding: 16px 12px;
                margin-top: 12px;
            }
            
            .service-btn {
                padding: 9px 16px;
                font-size: 10px;
                flex: 1 1 100%;
                min-width: auto;
            }
            
            .trusted-by,
            .impressions-text {
                font-size: 11px;
            }
            
            .social-proof {
                margin-top: 14px;
                padding-top: 14px;
            }
            
            .graph-wrapper {
                width: 140px;
                height: 140px;
                padding: 10px;
            }
            
            .graph-label {
                font-size: 7px;
                top: -18px;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="bannerContainer">
        <!-- Safe Area Indicator (hidden by default) -->
        <div class="safe-area"></div>
        
        <!-- Featured Button - Top Left Corner -->
        <button class="featured-btn">SEE WHAT'S FEATURED</button>
        
        <!-- Left Content -->
        <section class="content-section">
            <header class="main-heading">
                <h1 class="heading-title">
                    <span class="heading-line">Helping Founders & Coaches</span>
                    <span class="heading-line highlighted">Build and Monetize their</span>
                    <span class="heading-line">personal brand on X/LinkedIn</span>
                </h1>
            </header>
            
            <div class="services-wrapper">
                <nav class="services" aria-label="Services">
                    <button class="service-btn" type="button">Ghostwriting services</button>
                    <button class="service-btn" type="button">Brand Consulting</button>
                </nav>
                
                <div class="social-proof">
                    <p class="trusted-by">
                        Trusted by <strong class="highlight">+25 clients</strong>
                    </p>
                    <p class="impressions">
                        <span class="impressions-text">
                            <strong class="highlight">6.1M+ Impressions</strong> on
                        </span>
                        <span class="x-logo" aria-label="X platform">𝕏</span>
                    </p>
                </div>
            </div>
        </section>
        
        <!-- Right Visual - Diagrams -->
        <section class="visual-section" aria-label="Growth comparison">
            <div class="visual-container">
                <!-- Complex Path - Without Strategy -->
                <figure class="graph-figure">
                    <figcaption class="graph-label">
                        <span class="icon-error" aria-hidden="true">❌</span>
                        <span>WITHOUT STRATEGY</span>
                    </figcaption>
                    <div class="graph-wrapper complex">
                        <div class="graph-container">
                            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-label="Erratic growth chart">
                                <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                <polygon class="arrow" points="50,50 45,60 55,60"/>
                                <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                <polygon class="arrow" points="350,350 340,345 340,355"/>
                                <path class="complex-path" d="M 60 340 
                                    Q 80 320, 100 330
                                    Q 120 340, 110 300
                                    Q 100 260, 130 280
                                    Q 160 300, 150 250
                                    Q 140 200, 170 220
                                    Q 200 240, 190 200
                                    Q 180 160, 210 180
                                    Q 240 200, 230 150
                                    Q 220 100, 250 120
                                    Q 280 140, 270 100
                                    Q 260 60, 290 80
                                    Q 320 100, 310 70
                                    Q 300 50, 320 60
                                    Q 340 70, 330 80"/>
                                <circle class="start-point" cx="60" cy="340" r="7"/>
                                <circle class="end-point" cx="330" cy="80" r="7"/>
                            </svg>
                        </div>
                    </div>
                </figure>
                
                <!-- Arrow Divider -->
                <div class="arrow-divider" aria-hidden="true">→</div>
                
                <!-- Simple Path - With Ghostwriter -->
                <figure class="graph-figure">
                    <figcaption class="graph-label">
                        <span class="icon-success" aria-hidden="true">✅</span>
                        <span>WITH GHOSTWRITER</span>
                    </figcaption>
                    <div class="graph-wrapper">
                        <div class="graph-container">
                            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-label="Steady growth chart">
                                <defs>
                                    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
                                        <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:1" />
                                    </linearGradient>
                                </defs>
                                <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                <polygon class="arrow" points="50,50 45,60 55,60"/>
                                <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                <polygon class="arrow" points="350,350 340,345 340,355"/>
                                <line class="simple-path" x1="60" y1="340" x2="330" y2="80"/>
                                <circle class="start-point" cx="60" cy="340" r="7"/>
                                <circle class="end-point" cx="330" cy="80" r="9"/>
                            </svg>
                        </div>
                    </div>
                </figure>
            </div>
        </section>
    </div>
    
    <!-- Download Button -->
    <div class="download-section">
        <button class="download-btn" onclick="downloadAsJPEG()">Download JPEG</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadAsJPEG() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Generating...';
            button.disabled = true;
            
            try {
                const container = document.getElementById('bannerContainer');
                
                const canvas = await html2canvas(container, {
                    backgroundColor: '#000000',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    width: 1584,
                    height: 396
                });
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ghostwriter-linkedin-banner.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    button.textContent = originalText;
                    button.disabled = false;
                }, 'image/jpeg', 0.95);
                
            } catch (error) {
                console.error('Error generating JPEG:', error);
                alert('Error generating JPEG. Please try right-clicking and saving the image manually.');
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.querySelector('.banner');
            const contentSection = document.querySelector('.content-section');
            const visualSection = document.querySelector('.visual-section');
            
            // Initial state
            banner.style.opacity = '0';
            banner.style.transform = 'scale(0.96)';
            banner.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
            
            if (contentSection) {
                contentSection.style.opacity = '0';
                contentSection.style.transform = 'translateX(-30px)';
                contentSection.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s';
            }
            
            if (visualSection) {
                visualSection.style.opacity = '0';
                visualSection.style.transform = 'translateX(30px)';
                visualSection.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s';
            }
            
            // Animate in
            setTimeout(() => {
                banner.style.opacity = '1';
                banner.style.transform = 'scale(1)';
                
                if (contentSection) {
                    contentSection.style.opacity = '1';
                    contentSection.style.transform = 'translateX(0)';
                }
                
                if (visualSection) {
                    visualSection.style.opacity = '1';
                    visualSection.style.transform = 'translateX(0)';
                }
            }, 100);
        });
    </script>
</body>
</html>
