<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60 Substack Viral Posts - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .quick-action-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .quick-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        
        .quick-action-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .post-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        
        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        
        .post-card:hover::before {
            width: 100%;
            opacity: 0.1;
        }
        
        .post-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .post-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .post-preview {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        
        .tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            color: #666;
        }
        
        .tag.story { background: #ffe5e5; color: #d32f2f; }
        .tag.framework { background: #e3f2fd; color: #1976d2; }
        .tag.contrarian { background: #fff3e0; color: #f57c00; }
        .tag.data { background: #f1f8e9; color: #558b2f; }
        .tag.behind { background: #fce4ec; color: #c2185b; }
        
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #667eea;
        }
        
        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            overflow-y: auto;
        }
        
        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 40px;
            border-radius: 20px;
            max-width: 800px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #999;
            cursor: pointer;
        }
        
        .close:hover {
            color: #333;
        }
        
        .post-content {
            white-space: pre-wrap;
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            margin: 20px 0;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-success {
            background: #4caf50;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 768px) {
            .posts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 60 Substack Viral Posts</h1>
            <p>Click any post to view, customize, and copy. Optimized for rapid growth.</p>
        </div>
        
        <div class="quick-actions">
            <a href="SUBSTACK-GROWTH-ANALYSIS.md" class="quick-action-card">
                <h3>📊 Growth Analysis</h3>
                <p>What's working on Substack & top creators to study</p>
            </a>
            <a href="60-SUBSTACK-VIRAL-POSTS.md" class="quick-action-card">
                <h3>📝 All 60 Posts (Markdown)</h3>
                <p>View all posts in markdown format</p>
            </a>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search posts by title or content...">
        </div>
        
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All Posts</button>
            <button class="filter-btn" data-filter="story">Personal Stories</button>
            <button class="filter-btn" data-filter="framework">Frameworks</button>
            <button class="filter-btn" data-filter="contrarian">Contrarian Takes</button>
            <button class="filter-btn" data-filter="data">Data-Driven</button>
            <button class="filter-btn" data-filter="behind">Behind-the-Scenes</button>
        </div>
        
        <div class="posts-grid" id="postsGrid">
            <!-- Posts will be inserted here -->
        </div>
    </div>
    
    <!-- Modal -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>
    
    <script src="substack-posts-data.js"></script>
    <script>
        const modal = document.getElementById('postModal');
        const closeBtn = document.querySelector('.close');
        const modalContent = document.getElementById('modalContent');
        
        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => {
            if (e.target == modal) modal.style.display = 'none';
        };
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                const search = document.getElementById('searchInput').value;
                renderPosts(filter, search);
            });
        });
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const search = e.target.value;
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            renderPosts(activeFilter, search);
        });
        
        function renderPosts(filter = 'all', search = '') {
            const grid = document.getElementById('postsGrid');
            grid.innerHTML = '';
            
            const filtered = allSubstackPosts.filter(post => {
                const matchesFilter = filter === 'all' || post.tags.includes(filter);
                const matchesSearch = search === '' || 
                    post.title.toLowerCase().includes(search.toLowerCase()) ||
                    post.content.toLowerCase().includes(search.toLowerCase());
                return matchesFilter && matchesSearch;
            });
            
            filtered.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => showPost(post);
                
                const tagHTML = post.tags.map(tag => {
                    const tagClass = tag === 'story' ? 'story' : 
                                   tag === 'framework' ? 'framework' : 
                                   tag === 'contrarian' ? 'contrarian' : 
                                   tag === 'data' ? 'data' : 'behind';
                    return `<span class="tag ${tagClass}">${tag}</span>`;
                }).join('');
                
                card.innerHTML = `
                    <div class="post-number">Post #${post.number}</div>
                    <div class="post-title">${post.title}</div>
                    <div class="post-preview">${post.content.substring(0, 150)}...</div>
                    <div class="post-tags">${tagHTML}</div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        function showPost(post) {
            modalContent.innerHTML = `
                <h2>Post #${post.number}: ${post.title}</h2>
                <div style="background: #e3f2fd; padding: 20px; border-radius: 10px; margin: 20px 0;">
                    <h3>📋 Subject Line:</h3>
                    <p style="font-size: 1.2em; font-weight: bold; margin-top: 10px;">${post.subject}</p>
                </div>
                <div class="post-content">${post.content}</div>
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="copyPost(${post.number})">📋 Copy Post</button>
                    <button class="btn btn-primary" onclick="copySubject(${post.number})">📧 Copy Subject Line</button>
                </div>
            `;
            modal.style.display = 'block';
        }
        
        function copyPost(postNumber) {
            const post = allSubstackPosts.find(p => p.number === postNumber);
            if (post) {
                navigator.clipboard.writeText(post.content).then(() => {
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✅ Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                });
            }
        }
        
        function copySubject(postNumber) {
            const post = allSubstackPosts.find(p => p.number === postNumber);
            if (post) {
                navigator.clipboard.writeText(post.subject).then(() => {
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✅ Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                });
            }
        }
        
        renderPosts();
    </script>
</body>
</html>
