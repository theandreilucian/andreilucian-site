<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Ghostwriter Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #000000 0%, #001a1f 25%, #003d47 75%, #000000 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
            overflow: hidden;
        }
        
        /* Animated background effects */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            animation: pulse-bg 5s ease-in-out infinite;
        }
        
        @keyframes pulse-bg {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* Left Content Section */
        .content-section {
            flex: 0 0 600px;
            position: relative;
            z-index: 2;
        }
        
        .service-badge {
            display: inline-block;
            padding: 8px 18px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.25), rgba(0, 217, 255, 0.15));
            border: 2px solid #00d9ff;
            border-radius: 25px;
            color: #00d9ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.4);
            animation: badge-pulse 3s ease-in-out infinite;
        }
        
        @keyframes badge-pulse {
            0%, 100% { box-shadow: 0 0 25px rgba(0, 217, 255, 0.4); }
            50% { box-shadow: 0 0 35px rgba(0, 217, 255, 0.6); }
        }
        
        .main-heading {
            margin-bottom: 28px;
        }
        
        .heading-line {
            font-size: 48px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1.5px;
            font-family: 'Poppins', sans-serif;
        }
        
        .heading-line.white {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }
        
        .heading-line.teal {
            background: linear-gradient(135deg, #00d9ff 0%, #00e5ff 50%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            background-size: 200% 100%;
            animation: gradient-shift 3s ease infinite;
        }
        
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .subheading {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 12px;
            line-height: 1.4;
        }
        
        .social-proof {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 32px;
        }
        
        .proof-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .proof-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .proof-number {
            color: #00d9ff;
            font-weight: 900;
            font-size: 22px;
            text-shadow: 0 0 12px rgba(0, 217, 255, 0.6);
        }
        
        .proof-label {
            opacity: 0.95;
        }
        
        .highlight-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.25), rgba(0, 217, 255, 0.15));
            border: 2px solid #00d9ff;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.5);
        }
        
        .highlight-badge .proof-number {
            font-size: 24px;
        }
        
        /* Right Visual Section */
        .visual-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            padding-left: 40px;
        }
        
        .visual-container {
            display: flex;
            align-items: center;
            gap: 50px;
        }
        
        .graph-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            background: rgba(0, 217, 255, 0.08);
            border: 2.5px solid rgba(0, 217, 255, 0.3);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 
                0 0 40px rgba(0, 217, 255, 0.3),
                inset 0 0 40px rgba(0, 217, 255, 0.08);
        }
        
        .graph-wrapper.complex {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.15),
                inset 0 0 30px rgba(255, 255, 255, 0.03);
        }
        
        .graph-label {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }
        
        .graph-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .axis {
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
            opacity: 0.9;
        }
        
        .arrow {
            fill: #ffffff;
            opacity: 0.9;
        }
        
        .complex-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }
        
        .simple-path {
            fill: none;
            stroke: url(#tealGradient);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 18px rgba(0, 217, 255, 0.7));
            animation: path-glow 2.5s ease-in-out infinite alternate;
        }
        
        @keyframes path-glow {
            from { filter: drop-shadow(0 0 18px rgba(0, 217, 255, 0.7)); }
            to { filter: drop-shadow(0 0 28px rgba(0, 217, 255, 0.9)); }
        }
        
        .start-point {
            fill: #90ee90;
            stroke: #ffffff;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 8px rgba(144, 238, 144, 0.6));
        }
        
        .end-point {
            fill: #00d9ff;
            stroke: #ffffff;
            stroke-width: 3;
            filter: drop-shadow(0 0 18px rgba(0, 217, 255, 0.8));
            animation: point-pulse 2s ease-in-out infinite;
        }
        
        @keyframes point-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .arrow-divider {
            font-size: 56px;
            color: #00d9ff;
            font-weight: 300;
            text-shadow: 0 0 25px rgba(0, 217, 255, 0.7);
            animation: arrow-slide 2.5s ease-in-out infinite;
        }
        
        @keyframes arrow-slide {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }
        
        /* Download button */
        .download-section {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #00d9ff 0%, #00b8d9 100%);
            color: #000000;
            border: none;
            padding: 12px 26px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.4);
            text-transform: uppercase;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 217, 255, 0.6);
            background: linear-gradient(135deg, #00e5ff 0%, #00c9e8 100%);
        }
        
        @media (max-width: 1700px) {
            .banner {
                width: 100%;
                max-width: 1584px;
                height: auto;
                min-height: 396px;
                aspect-ratio: 4 / 1;
            }
        }
        
        @media (max-width: 1200px) {
            .banner {
                flex-direction: column;
                padding: 30px 20px;
                gap: 30px;
                height: auto;
            }
            
            .content-section {
                flex: 1;
                text-align: center;
            }
            
            .heading-line {
                font-size: 36px;
            }
            
            .visual-section {
                padding-left: 0;
            }
            
            .graph-wrapper {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="bannerContainer">
        <!-- Left Content -->
        <div class="content-section">
            <div class="service-badge">✍️ Professional Ghostwriter</div>
            
            <div class="main-heading">
                <div class="heading-line white">I Write Content</div>
                <div class="heading-line teal">That Grows Your Brand</div>
            </div>
            
            <div class="subheading">
                Stop struggling with inconsistent posts.<br>
                Start building authority with strategic content.
            </div>
            
            <div class="social-proof">
                <div class="proof-row">
                    <div class="proof-item">
                        <span class="proof-label">Trusted by</span>
                        <span class="proof-number">+25</span>
                        <span class="proof-label">clients</span>
                    </div>
                </div>
                <div class="proof-row">
                    <div class="highlight-badge">
                        <span>⚡</span>
                        <span class="proof-number">800</span>
                        <span class="proof-label">followers in 24h</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Visual -->
        <div class="visual-section">
            <div class="visual-container">
                <!-- Complex Path -->
                <div style="position: relative;">
                    <div class="graph-label">❌ Without Strategy</div>
                    <div class="graph-wrapper complex">
                        <div class="graph-container">
                            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                                <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                <polygon class="arrow" points="50,50 45,60 55,60"/>
                                <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                <polygon class="arrow" points="350,350 340,345 340,355"/>
                                <path class="complex-path" d="M 60 340 
                                    Q 80 320, 100 330
                                    Q 120 340, 110 300
                                    Q 100 260, 130 280
                                    Q 160 300, 150 250
                                    Q 140 200, 170 220
                                    Q 200 240, 190 200
                                    Q 180 160, 210 180
                                    Q 240 200, 230 150
                                    Q 220 100, 250 120
                                    Q 280 140, 270 100
                                    Q 260 60, 290 80
                                    Q 320 100, 310 70
                                    Q 300 50, 320 60
                                    Q 340 70, 330 80"/>
                                <circle class="start-point" cx="60" cy="340" r="7"/>
                                <circle class="end-point" cx="330" cy="80" r="7"/>
                            </svg>
                        </div>
                    </div>
                </div>
                
                <!-- Arrow -->
                <div class="arrow-divider">→</div>
                
                <!-- Simple Path -->
                <div style="position: relative;">
                    <div class="graph-label">✅ With Ghostwriter</div>
                    <div class="graph-wrapper">
                        <div class="graph-container">
                            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
                                        <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:1" />
                                    </linearGradient>
                                </defs>
                                <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                <polygon class="arrow" points="50,50 45,60 55,60"/>
                                <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                <polygon class="arrow" points="350,350 340,345 340,355"/>
                                <line class="simple-path" x1="60" y1="340" x2="330" y2="80"/>
                                <circle class="start-point" cx="60" cy="340" r="7"/>
                                <circle class="end-point" cx="330" cy="80" r="9"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Download Button -->
        <div class="download-section">
            <button class="download-btn" onclick="downloadAsJPEG()">Download JPEG</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadAsJPEG() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Generating...';
            button.disabled = true;
            
            try {
                const container = document.getElementById('bannerContainer');
                
                const canvas = await html2canvas(container, {
                    backgroundColor: '#000000',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    width: 1584,
                    height: 396
                });
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'linkedin-ghostwriter-banner.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    button.textContent = originalText;
                    button.disabled = false;
                }, 'image/jpeg', 0.95);
                
            } catch (error) {
                console.error('Error generating JPEG:', error);
                alert('Error generating JPEG. Please try right-clicking and saving the image manually.');
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.querySelector('.banner');
            banner.style.opacity = '0';
            banner.style.transform = 'scale(0.96)';
            banner.style.transition = 'all 0.8s ease';
            
            setTimeout(() => {
                banner.style.opacity = '1';
                banner.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body>
</html>
