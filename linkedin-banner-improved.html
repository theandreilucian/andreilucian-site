<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Banner - Improved</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #000000 0%, #001a1f 50%, #003d47 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
        }
        
        /* Background decorative elements */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 217, 255, 0.3), transparent);
        }
        
        /* Left Content Section */
        .content-section {
            flex: 1;
            max-width: 900px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        /* Featured Button */
        .featured-btn {
            align-self: flex-start;
            padding: 8px 20px;
            border: 1.5px solid #00d9ff;
            background: transparent;
            color: #00d9ff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .featured-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.3);
        }
        
        /* Main Heading */
        .main-heading {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .heading-line {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1.5px;
            font-family: 'Inter', sans-serif;
        }
        
        .heading-line.white {
            color: #ffffff;
        }
        
        .heading-line.teal {
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
        }
        
        .heading-line .highlight {
            font-weight: 900;
            position: relative;
        }
        
        /* Service Buttons */
        .services {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .service-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #00d9ff 0%, #00b8d9 100%);
            color: #000000;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }
        
        .service-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 217, 255, 0.5);
            background: linear-gradient(135deg, #00e5ff 0%, #00c9e8 100%);
        }
        
        /* Impressions Section */
        .impressions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        
        .impressions-text {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }
        
        .x-logo {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 12px;
            color: #000000;
            margin-left: 4px;
        }
        
        /* Avatar Section */
        .avatar-section {
            position: relative;
            z-index: 2;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .avatar-container {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 3px solid rgba(0, 217, 255, 0.3);
            box-shadow: 
                0 0 40px rgba(0, 217, 255, 0.2),
                inset 0 0 40px rgba(0, 217, 255, 0.1);
        }
        
        .avatar-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff, #00b8d9, #00d9ff);
            z-index: -1;
            opacity: 0.5;
        }
        
        .avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(1.1) brightness(0.95);
        }
        
        /* Decorative circles */
        .decoration-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 217, 255, 0.2);
            pointer-events: none;
        }
        
        .circle-1 {
            width: 120px;
            height: 120px;
            top: -40px;
            right: 20px;
        }
        
        .circle-2 {
            width: 80px;
            height: 80px;
            bottom: -20px;
            right: 60px;
        }
        
        /* Responsive */
        @media (max-width: 1700px) {
            .banner {
                width: 100%;
                max-width: 1584px;
                height: auto;
                min-height: 396px;
                aspect-ratio: 4 / 1;
            }
        }
        
        @media (max-width: 1200px) {
            .banner {
                flex-direction: column;
                padding: 40px;
                gap: 30px;
            }
            
            .heading-line {
                font-size: 36px;
            }
            
            .avatar-section {
                width: 200px;
                height: 200px;
            }
            
            .avatar-container {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Decorative circles -->
        <div class="decoration-circle circle-1"></div>
        <div class="decoration-circle circle-2"></div>
        
        <!-- Left Content -->
        <div class="content-section">
            <button class="featured-btn">SEE WHAT'S FEATURED</button>
            
            <div class="main-heading">
                <div class="heading-line white">Helping Founders & Coaches</div>
                <div class="heading-line teal">
                    <span class="highlight">Build</span> and <span class="highlight">Monetize</span> their
                </div>
                <div class="heading-line white">personal brands on LinkedIn</div>
            </div>
            
            <div class="services">
                <button class="service-btn">Ghostwriting services</button>
                <button class="service-btn">Brand Consulting</button>
            </div>
            
            <div class="impressions">
                <span class="impressions-text">6.1M+ Impressions on</span>
                <span class="x-logo">𝕏</span>
            </div>
        </div>
        
        <!-- Right Avatar -->
        <div class="avatar-section">
            <div class="avatar-container">
                <!-- Replace this path with your actual avatar image -->
                <img src="assets/images/avatar-placeholder.jpg" alt="Profile" class="avatar-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div style="display:none; width:100%; height:100%; background:linear-gradient(135deg, #00d9ff20, #00b8d920); align-items:center; justify-content:center; color:#00d9ff; font-size:14px; text-align:center; padding:20px;">
                    Replace with<br>your avatar<br>image
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Add subtle animation on load
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.querySelector('.banner');
            banner.style.opacity = '0';
            banner.style.transform = 'translateY(20px)';
            banner.style.transition = 'all 0.6s ease';
            
            setTimeout(() => {
                banner.style.opacity = '1';
                banner.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
