<svg width="1584" height="396" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Turquoise gradient -->
    <linearGradient id="turquoiseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40e0d0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Circular mask for profile picture -->
    <clipPath id="circleClip">
      <circle cx="1320" cy="198" r="120"/>
    </clipPath>
    
    <!-- Circular masks for client profile pictures -->
    <clipPath id="clientCircle1"><circle cx="1100" cy="355" r="18"/></clipPath>
    <clipPath id="clientCircle2"><circle cx="1125" cy="355" r="18"/></clipPath>
    <clipPath id="clientCircle3"><circle cx="1150" cy="355" r="18"/></clipPath>
    <clipPath id="clientCircle4"><circle cx="1175" cy="355" r="18"/></clipPath>
    <clipPath id="clientCircle5"><circle cx="1200" cy="355" r="18"/></clipPath>
    <clipPath id="clientCircle6"><circle cx="1225" cy="355" r="18"/></clipPath>
    <clipPath id="clientCircle7"><circle cx="1250" cy="355" r="18"/></clipPath>
    <clipPath id="clientCircle8"><circle cx="1275" cy="355" r="18"/></clipPath>
  </defs>
  
  <!-- Black background -->
  <rect width="1584" height="396" fill="#000000"/>
  
  <!-- Subtle divider line -->
  <line x1="950" y1="0" x2="950" y2="396" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- LEFT SECTION (60%) - Centered content -->
  <g transform="translate(475, 0)">
    <!-- Small text above -->
    <text x="0" y="150" 
          font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" 
          font-size="18" 
          font-weight="400" 
          fill="#ffffff" 
          text-anchor="middle"
          opacity="0.9">
      Book a free call for
    </text>
    
    <!-- Main CTA -->
    <text x="0" y="210" 
          font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" 
          font-size="48" 
          font-weight="700" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="1px">
      <tspan fill="#40e0d0">offer</tspan> + <tspan fill="#40e0d0">content</tspan> <tspan fill="#ffffff">clarity</tspan> ↓
    </text>
  </g>
  
  <!-- RIGHT SECTION (40%) -->
  <!-- Main headline -->
  <text x="1100" y="70" 
        font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" 
        font-size="32" 
        font-weight="700" 
        fill="#ffffff" 
        letter-spacing="0.5px">
    "Your <tspan fill="#40e0d0">LinkedIn Growth Partner</tspan> - 💪"
  </text>
  
  <!-- Services section - cleaner design -->
  <g transform="translate(1100, 110)">
    <!-- Service 1: Ghostwriting -->
    <rect x="0" y="0" width="380" height="45" rx="5" fill="#40e0d0" opacity="0.15" stroke="#40e0d0" stroke-width="1.5"/>
    <circle cx="22" cy="22.5" r="6" fill="none" stroke="#40e0d0" stroke-width="2"/>
    <path d="M 18 22.5 L 18 28 M 26 22.5 L 26 28" stroke="#40e0d0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 14 18 Q 22 14 30 18" stroke="#40e0d0" stroke-width="2" fill="none"/>
    <line x1="30" y1="18" x2="35" y2="14" stroke="#40e0d0" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="29" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#40e0d0">Ghostwriting</text>
    
    <!-- Service 2: Design -->
    <rect x="0" y="55" width="380" height="45" rx="5" fill="#40e0d0" opacity="0.15" stroke="#40e0d0" stroke-width="1.5"/>
    <path d="M 18 42 L 26 50 M 26 42 L 18 50" stroke="#40e0d0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="42" r="2.5" fill="none" stroke="#40e0d0" stroke-width="1.5"/>
    <circle cx="26" cy="50" r="2.5" fill="none" stroke="#40e0d0" stroke-width="1.5"/>
    <line x1="22" y1="46" x2="30" y2="54" stroke="#40e0d0" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="72" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#40e0d0">Design</text>
    
    <!-- Service 3: Engagement -->
    <rect x="0" y="110" width="380" height="45" rx="5" fill="#40e0d0" opacity="0.15" stroke="#40e0d0" stroke-width="1.5"/>
    <path d="M 18 120 Q 18 115 22 115 L 30 115 Q 34 115 34 120 L 34 128 L 26 128 L 22 132 L 22 128 L 18 128 Z" 
          fill="none" stroke="#40e0d0" stroke-width="2"/>
    <circle cx="24" cy="122" r="1.2" fill="#40e0d0"/>
    <circle cx="28" cy="122" r="1.2" fill="#40e0d0"/>
    <circle cx="32" cy="122" r="1.2" fill="#40e0d0"/>
    <text x="40" y="127" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#40e0d0">Engagement</text>
  </g>
  
  <!-- Client logos section - improved -->
  <rect x="1100" y="270" width="380" height="35" rx="4" fill="#40e0d0" opacity="0.25"/>
  <text x="1290" y="292" 
        font-family="'Inter', sans-serif" 
        font-size="15" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="2px">
    pwc  |  L'ORÉAL  |  CSIRO
  </text>
  
  <!-- Client profile pictures - tighter spacing -->
  <g transform="translate(0, 0)">
    <image x="1082" y="337" width="36" height="36" href="assets/images/testimonials/Alex Stefan.jpg" clip-path="url(#clientCircle1)" preserveAspectRatio="xMidYMid slice"/>
    <image x="1107" y="337" width="36" height="36" href="assets/images/testimonials/David.jpg" clip-path="url(#clientCircle2)" preserveAspectRatio="xMidYMid slice"/>
    <image x="1132" y="337" width="36" height="36" href="assets/images/testimonials/Miguel.jpg" clip-path="url(#clientCircle3)" preserveAspectRatio="xMidYMid slice"/>
    <image x="1157" y="337" width="36" height="36" href="assets/images/testimonials/Roxana.jpg" clip-path="url(#clientCircle4)" preserveAspectRatio="xMidYMid slice"/>
    <image x="1182" y="337" width="36" height="36" href="assets/images/testimonials/Glenn.jpg" clip-path="url(#clientCircle5)" preserveAspectRatio="xMidYMid slice"/>
    <image x="1207" y="337" width="36" height="36" href="assets/images/testimonials/Jack Moth.jpg" clip-path="url(#clientCircle6)" preserveAspectRatio="xMidYMid slice"/>
    <image x="1232" y="337" width="36" height="36" href="assets/images/testimonials/Sean - LinkedIn Ghostwriting Testimonial.jpg" clip-path="url(#clientCircle7)" preserveAspectRatio="xMidYMid slice"/>
    <image x="1257" y="337" width="36" height="36" href="assets/images/testimonials/Dan Munteanu.jpg" clip-path="url(#clientCircle8)" preserveAspectRatio="xMidYMid slice"/>
    
    <!-- "and more" text -->
    <text x="1300" y="360" 
          font-family="'Inter', sans-serif" 
          font-size="13" 
          font-weight="400" 
          fill="#ffffff" 
          opacity="0.7">
      ... and more
    </text>
  </g>
  
  <!-- Profile picture on right (LinkedIn position) -->
  <image x="1200" y="78" width="240" height="240" 
         href="assets/images/profile-picture.jpg" 
         clip-path="url(#circleClip)"
         preserveAspectRatio="xMidYMid slice"/>
  
</svg>