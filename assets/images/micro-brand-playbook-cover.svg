<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-labelledby="coverTitle">
  <title id="coverTitle">The Micro-Brand Playbook by Andrei Lucian</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="100%" style="stop-color:#0c0c12"/>
    </linearGradient>
    <radialGradient id="v" cx="50%" cy="42%" r="55%">
      <stop offset="0%" style="stop-color:#1a1528;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#050508;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#v)"/>

  <!-- Left accent (blueprint bar) -->
  <rect x="86" y="262" width="12" height="244" fill="#1d9bf0" rx="2"/>

  <!-- Stylized platform tiles (generic treatment) -->
  <g transform="translate(300,128)">
    <rect x="-66" y="-24" width="48" height="48" rx="12" fill="#1d9bf0"/>
    <path d="M-52 -6 L-32 12 M-32 -6 L-52 12" stroke="#050508" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="18" y="-24" width="48" height="48" rx="10" fill="#0a66c2"/>
    <text x="42" y="10" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700">in</text>
  </g>

  <!-- Title -->
  <text x="300" y="410" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.04em">The Micro-Brand</text>
  <text x="300" y="458" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.04em">Playbook</text>

  <!-- Underline -->
  <line x1="156" y1="478" x2="484" y2="478" stroke="#1d9bf0" stroke-width="2"/>

  <!-- Subtitle -->
  <text text-anchor="middle" fill="rgba(255,255,255,0.88)" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">
    <tspan x="300" y="518">Grow on X &amp; LinkedIn</tspan>
    <tspan x="300" y="542">&#8212; without the overwhelm</tspan>
  </text>

  <!-- Author -->
  <text x="300" y="726" text-anchor="middle" fill="rgba(255,255,255,0.72)" font-family="Georgia,ui-serif,serif" font-size="18" font-style="italic">Andrei Lucian</text>
</svg>
