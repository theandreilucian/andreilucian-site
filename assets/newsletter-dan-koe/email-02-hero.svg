<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="wc2-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc2-hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc2-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#141414" opacity="0.45"/>
      <circle cx="5" cy="4" r="0.7" fill="#141414" opacity="0.3"/>
    </pattern>
    <filter id="wc2-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
    <mask id="wc2-fade"><rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="900" width="1920" height="180" fill="url(#wc2-grad)"/>
    </mask>
    <linearGradient id="wc2-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f3f1ec" filter="url(#wc2-paper)"/>
  <text x="960" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#5a5a5a" letter-spacing="8">EXPERIMENT</text>
  <text x="960" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#141414" font-weight="700">30 Days</text>
  <text x="960" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#5a5a5a" font-style="italic">track inputs only</text>
  <g mask="url(#wc2-fade)">
    <rect x="620" y="400" width="680" height="440" rx="2" fill="none" stroke="#141414" stroke-width="3"/>
  <path d="M620 400 H1300 V520 H620 Z" fill="url(#wc2-hatch)"/><path d="M620 400 H1300 V520 H620 Z" fill="url(#wc2-hatch2)" opacity="0.5"/>
    <line x1="620" y1="520" x2="1300" y2="520" stroke="#141414" stroke-width="2"/>
    <line x1="780" y1="400" x2="780" y2="840" stroke="#141414" stroke-width="1" opacity="0.4"/>
    <line x1="960" y1="400" x2="960" y2="840" stroke="#141414" stroke-width="1" opacity="0.4"/>
    <line x1="1140" y1="400" x2="1140" y2="840" stroke="#141414" stroke-width="1" opacity="0.4"/>
    <!-- left hand -->
    <path d="M480 620 Q520 580 560 600 L580 680 Q540 720 500 700 Z" fill="none" stroke="#141414" stroke-width="2.5"/>
    <path d="M480 620 Q520 580 560 600 L580 680 Q540 720 500 700 Z" fill="url(#wc2-hatch)"/><path d="M480 620 Q520 580 560 600 L580 680 Q540 720 500 700 Z" fill="url(#wc2-hatch2)" opacity="0.5"/>
    <!-- right hand with quill -->
    <path d="M1380 580 Q1340 540 1300 560 L1280 640 Q1320 680 1360 660 Z" fill="none" stroke="#141414" stroke-width="2.5"/>
    <line x1="1290" y1="560" x2="1240" y2="480" stroke="#141414" stroke-width="2"/>
    <text x="700" y="600" font-family="Georgia,serif" font-size="22" fill="#141414">3</text>
    <text x="860" y="600" font-family="Georgia,serif" font-size="22" fill="#141414">47</text>
    <text x="1040" y="600" font-family="Georgia,serif" font-size="22" fill="#141414">52</text></g>
  <text x="960" y="1045" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#999" letter-spacing="4">ANDREI LUCIAN &#183; NEWSLETTER</text>
</svg>