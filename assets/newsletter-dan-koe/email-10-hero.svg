<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="wc10-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc10-hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc10-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#141414" opacity="0.45"/>
      <circle cx="5" cy="4" r="0.7" fill="#141414" opacity="0.3"/>
    </pattern>
    <filter id="wc10-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
    <mask id="wc10-fade"><rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="900" width="1920" height="180" fill="url(#wc10-grad)"/>
    </mask>
    <linearGradient id="wc10-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f3f1ec" filter="url(#wc10-paper)"/>
  <text x="960" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#5a5a5a" letter-spacing="8">PLATFORMS</text>
  <text x="960" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#141414" font-weight="700">Two Games</text>
  <text x="960" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#5a5a5a" font-style="italic">𝕏 speed · LinkedIn depth</text>
  <g mask="url(#wc10-fade)">
    <rect x="480" y="360" width="360" height="480" fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M480 360 H840 V480 H480 Z" fill="url(#wc10-hatch)"/><path d="M480 360 H840 V480 H480 Z" fill="url(#wc10-hatch2)" opacity="0.5"/>
    <text x="660" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#141414">𝕏</text>
    <text x="660" y="700" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#141414">5.3K</text>
    <rect x="1080" y="360" width="360" height="480" fill="none" stroke="#141414" stroke-width="3"/>
    <text x="1260" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#141414">LINKEDIN</text>
    <text x="1260" y="700" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#141414">16.2K</text>
    <line x1="960" y1="360" x2="960" y2="840" stroke="#141414" stroke-width="2"/></g>
  <text x="960" y="1045" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#999" letter-spacing="4">ANDREI LUCIAN &#183; NEWSLETTER</text>
</svg>