<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="wc3-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc3-hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc3-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#141414" opacity="0.45"/>
      <circle cx="5" cy="4" r="0.7" fill="#141414" opacity="0.3"/>
    </pattern>
    <filter id="wc3-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
    <mask id="wc3-fade"><rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="900" width="1920" height="180" fill="url(#wc3-grad)"/>
    </mask>
    <linearGradient id="wc3-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f3f1ec" filter="url(#wc3-paper)"/>
  <text x="960" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#5a5a5a" letter-spacing="8">TIMELINE</text>
  <text x="960" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#141414" font-weight="700">Flat Months</text>
  <text x="960" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#5a5a5a" font-style="italic">then the bend</text>
  <g mask="url(#wc3-fade)">
    <path d="M280 820 L1640 820" stroke="#141414" stroke-width="4"/>
    <!-- massive boulder -->
    <path d="M620 520 Q720 420 860 440 Q1020 460 1080 560 Q1120 640 1040 700 Q920 760 780 720 Q640 680 620 520" fill="none" stroke="#141414" stroke-width="3.5"/>
    <path d="M640 540 Q780 480 920 540 Q980 620 860 680 Q700 700 640 540" fill="url(#wc3-stipple)"/>
    <path d="M700 560 Q820 500 940 560 Q960 640 860 680 Q740 660 700 560" fill="url(#wc3-hatch)"/><path d="M700 560 Q820 500 940 560 Q960 640 860 680 Q740 660 700 560" fill="url(#wc3-hatch2)" opacity="0.5"/>
    <!-- muscular figure bent under weight -->
    <path d="M540 820 L560 680 Q580 620 640 580 L680 600 L660 680 L620 760 L600 820 Z" fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M560 640 Q600 600 640 580 L680 600 L660 660 L620 700 Z" fill="url(#wc3-hatch)"/><path d="M560 640 Q600 600 640 580 L680 600 L660 660 L620 700 Z" fill="url(#wc3-hatch2)" opacity="0.5"/>
    <path d="M600 820 L640 820 L650 720 L610 720 Z" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M660 820 L700 820 L690 720 L650 720 Z" fill="none" stroke="#141414" stroke-width="2"/>
    <circle cx="615" cy="555" r="28" fill="none" stroke="#141414" stroke-width="2.5"/>
    <path d="M595 535 a28 30 0 1 1 40 0" fill="url(#wc3-hatch)"/><path d="M595 535 a28 30 0 1 1 40 0" fill="url(#wc3-hatch2)" opacity="0.5"/>
    <!-- distant slope hint -->
    <path d="M1100 820 Q1300 700 1500 500 Q1580 400 1620 350" fill="none" stroke="#141414" stroke-width="1.5" opacity="0.2" stroke-dasharray="6"/>
    <text x="960" y="880" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#5a5a5a" font-style="italic">the flat is the tutorial</text></g>
  <text x="960" y="1045" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#999" letter-spacing="4">ANDREI LUCIAN &#183; NEWSLETTER</text>
</svg>