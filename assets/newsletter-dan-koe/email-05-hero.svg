<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="wc5-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc5-hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc5-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#141414" opacity="0.45"/>
      <circle cx="5" cy="4" r="0.7" fill="#141414" opacity="0.3"/>
    </pattern>
    <filter id="wc5-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
    <mask id="wc5-fade"><rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="900" width="1920" height="180" fill="url(#wc5-grad)"/>
    </mask>
    <linearGradient id="wc5-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f3f1ec" filter="url(#wc5-paper)"/>
  <text x="960" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#5a5a5a" letter-spacing="8">LETTER</text>
  <text x="960" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#141414" font-weight="700">200 Followers</text>
  <text x="960" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#5a5a5a" font-style="italic">dear past me</text>
  <g mask="url(#wc5-fade)">
    <path d="M560 720 L560 420 L1360 420 L1360 720 Z" fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M560 420 L960 560 L1360 420" fill="none" stroke="#141414" stroke-width="2.5"/>
    <path d="M560 420 L960 560 L1360 420 L1360 500 L960 620 L560 500 Z" fill="url(#wc5-hatch)"/><path d="M560 420 L960 560 L1360 420 L1360 500 L960 620 L560 500 Z" fill="url(#wc5-hatch2)" opacity="0.5"/>
    <text x="620" y="500" font-family="Georgia,serif" font-size="22" fill="#141414" font-style="italic">Dear Andrei at 200,</text>
    <text x="620" y="560" font-family="Georgia,serif" font-size="18" fill="#5a5a5a" font-style="italic">don't quit.</text>
    <text x="1100" y="680" font-family="Georgia,serif" font-size="18" fill="#141414" font-style="italic">— future you</text>
    <!-- wax seal -->
    <circle cx="960" cy="600" r="40" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M920 560 a40 40 0 1 1 80 0" fill="url(#wc5-stipple)"/></g>
  <text x="960" y="1045" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#999" letter-spacing="4">ANDREI LUCIAN &#183; NEWSLETTER</text>
</svg>