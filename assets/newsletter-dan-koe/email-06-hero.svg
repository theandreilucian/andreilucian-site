<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="wc6-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc6-hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc6-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#141414" opacity="0.45"/>
      <circle cx="5" cy="4" r="0.7" fill="#141414" opacity="0.3"/>
    </pattern>
    <filter id="wc6-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
    <mask id="wc6-fade"><rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="900" width="1920" height="180" fill="url(#wc6-grad)"/>
    </mask>
    <linearGradient id="wc6-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f3f1ec" filter="url(#wc6-paper)"/>
  <text x="960" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#5a5a5a" letter-spacing="8">OPERATOR</text>
  <text x="960" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#141414" font-weight="700">The Machine</text>
  <text x="960" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#5a5a5a" font-style="italic">inputs → lag → output</text>
  <g mask="url(#wc6-fade)">
    <!-- giant hand from above -->
    <path d="M700 280 Q800 200 900 240 Q1000 280 1020 360 L980 400 Q900 380 840 420 Q780 460 760 520 L720 500 Q700 400 700 280" fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M720 300 Q800 240 880 280 Q920 340 880 400 Q820 420 780 460 L740 440 Q720 380 720 300" fill="url(#wc6-hatch)"/><path d="M720 300 Q800 240 880 280 Q920 340 880 400 Q820 420 780 460 L740 440 Q720 380 720 300" fill="url(#wc6-hatch2)" opacity="0.5"/>
    <!-- strings -->
    <line x1="800" y1="420" x2="780" y2="560" stroke="#141414" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="880" y1="420" x2="900" y2="560" stroke="#141414" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="960" y1="400" x2="960" y2="560" stroke="#141414" stroke-width="1.5" stroke-dasharray="4"/>
    <!-- small figure = you, on schedule -->
    <circle cx="840" cy="590" r="22" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M828 612 L828 680 M852 612 L852 680" stroke="#141414" stroke-width="2"/>
    <!-- gears at base -->
    <circle cx="960" cy="740" r="70" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M900 670 a70 70 0 1 1 120 0" fill="url(#wc6-stipple)"/>
    <circle cx="960" cy="740" r="20" fill="#141414"/>
    <text x="960" y="860" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#5a5a5a" font-style="italic">the calendar controls you</text></g>
  <text x="960" y="1045" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#999" letter-spacing="4">ANDREI LUCIAN &#183; NEWSLETTER</text>
</svg>