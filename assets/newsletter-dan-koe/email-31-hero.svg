<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="wc31-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc31-hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc31-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#141414" opacity="0.45"/>
      <circle cx="5" cy="4" r="0.7" fill="#141414" opacity="0.3"/>
    </pattern>
    <filter id="wc31-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
    <mask id="wc31-fade"><rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="900" width="1920" height="180" fill="url(#wc31-grad)"/>
    </mask>
    <linearGradient id="wc31-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f3f1ec" filter="url(#wc31-paper)"/>
  <text x="960" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#5a5a5a" letter-spacing="8">CLASSIC</text>
  <text x="960" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#141414" font-weight="700">Seven Steps</text>
  <text x="960" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#5a5a5a" font-style="italic">niche → freedom</text>
  <g mask="url(#wc31-fade)">
    <rect x="640" y="720" width="120" height="36" fill="none" stroke="#141414" stroke-width="2"/><rect x="730" y="675" width="120" height="36" fill="none" stroke="#141414" stroke-width="2"/><rect x="820" y="630" width="120" height="36" fill="none" stroke="#141414" stroke-width="2"/><rect x="910" y="585" width="120" height="36" fill="none" stroke="#141414" stroke-width="2"/><rect x="1000" y="540" width="120" height="36" fill="none" stroke="#141414" stroke-width="2"/><rect x="1090" y="495" width="120" height="36" fill="none" stroke="#141414" stroke-width="2"/><rect x="1180" y="450" width="120" height="36" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M700 760 L1240 500" stroke="#141414" stroke-width="1.5" stroke-dasharray="6" opacity="0.4"/></g>
  <text x="960" y="1045" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#999" letter-spacing="4">ANDREI LUCIAN &#183; NEWSLETTER</text>
</svg>