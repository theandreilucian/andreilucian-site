<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="wc8-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc8-hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#141414" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="wc8-stipple" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#141414" opacity="0.45"/>
      <circle cx="5" cy="4" r="0.7" fill="#141414" opacity="0.3"/>
    </pattern>
    <filter id="wc8-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
    <mask id="wc8-fade"><rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="900" width="1920" height="180" fill="url(#wc8-grad)"/>
    </mask>
    <linearGradient id="wc8-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f3f1ec" filter="url(#wc8-paper)"/>
  <text x="960" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#5a5a5a" letter-spacing="8">RECEIPTS</text>
  <text x="960" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#141414" font-weight="700">Advice vs Proof</text>
  <text x="960" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#5a5a5a" font-style="italic">which one spreads</text>
  <g mask="url(#wc8-fade)">
    <line x1="960" y1="380" x2="960" y2="780" stroke="#141414" stroke-width="4"/>
    <line x1="700" y1="420" x2="1220" y2="420" stroke="#141414" stroke-width="3"/>
    <line x1="700" y1="420" x2="700" y2="580" stroke="#141414" stroke-width="2"/>
    <line x1="1220" y1="420" x2="1220" y2="520" stroke="#141414" stroke-width="2"/>
    <!-- left pan - light -->
    <ellipse cx="700" cy="600" rx="100" ry="20" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M640 600 Q700 680 760 600" fill="none" stroke="#141414" stroke-width="2"/>
    <text x="700" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#5a5a5a">"post more"</text>
    <!-- right pan - heavy -->
    <ellipse cx="1220" cy="560" rx="100" ry="20" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M1160 560 Q1220 660 1280 560 L1280 540 Q1220 520 1160 540 Z" fill="url(#wc8-hatch)"/><path d="M1160 560 Q1220 660 1280 560 L1280 540 Q1220 520 1160 540 Z" fill="url(#wc8-hatch2)" opacity="0.5"/>
    <text x="1220" y="520" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#141414">$223 · 50 replies</text></g>
  <text x="960" y="1045" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#999" letter-spacing="4">ANDREI LUCIAN &#183; NEWSLETTER</text>
</svg>