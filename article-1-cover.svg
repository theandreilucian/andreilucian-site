<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="texture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#000" opacity="0.1"/>
      <circle cx="30" cy="25" r="0.5" fill="#000" opacity="0.1"/>
      <circle cx="50" cy="15" r="1.5" fill="#000" opacity="0.1"/>
      <circle cx="70" cy="40" r="0.8" fill="#000" opacity="0.1"/>
      <circle cx="90" cy="20" r="1" fill="#000" opacity="0.1"/>
    </pattern>
    <radialGradient id="lightGradient" cx="50%" cy="0%" r="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="30%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="60%" style="stop-color:#cccccc;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#000000"/>
  
  <!-- Swirling textures in background -->
  <g opacity="0.3">
    <path d="M 0 800 Q 200 700, 400 750 T 800 800 T 1200 850 T 1600 800 T 1920 850" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M 0 900 Q 300 850, 600 900 T 1200 950 T 1920 900" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M 0 1000 Q 250 950, 500 1000 T 1000 1050 T 1920 1000" stroke="#333" fill="none" stroke-width="2"/>
  </g>
  
  <!-- Light rays from above -->
  <g opacity="0.4">
    <path d="M 960 0 L 800 200 L 1120 200 Z" fill="url(#lightGradient)"/>
    <path d="M 960 0 L 700 300 L 1220 300 Z" fill="url(#lightGradient)"/>
    <path d="M 960 0 L 600 400 L 1320 400 Z" fill="url(#lightGradient)"/>
  </g>
  
  <!-- Pit/Abyss walls with swirling textures -->
  <g opacity="0.6">
    <!-- Left wall -->
    <path d="M 0 1080 L 400 600 Q 500 500, 600 550 L 700 1080 Z" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
    <path d="M 100 1000 Q 200 900, 300 950" stroke="#444" fill="none" stroke-width="2"/>
    <path d="M 150 950 Q 250 850, 350 900" stroke="#444" fill="none" stroke-width="2"/>
    <path d="M 200 900 Q 300 800, 400 850" stroke="#444" fill="none" stroke-width="2"/>
    
    <!-- Right wall -->
    <path d="M 1920 1080 L 1520 600 Q 1420 500, 1320 550 L 1220 1080 Z" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
    <path d="M 1820 1000 Q 1720 900, 1620 950" stroke="#444" fill="none" stroke-width="2"/>
    <path d="M 1770 950 Q 1670 850, 1570 900" stroke="#444" fill="none" stroke-width="2"/>
    <path d="M 1720 900 Q 1620 800, 1520 850" stroke="#444" fill="none" stroke-width="2"/>
  </g>
  
  <!-- Person climbing upward (silhouette) -->
  <g transform="translate(960, 800)">
    <!-- Body (diagonal, reaching upward) -->
    <ellipse cx="0" cy="50" rx="25" ry="80" fill="#000000" transform="rotate(-20)"/>
    
    <!-- Head -->
    <circle cx="0" cy="-30" r="20" fill="#000000"/>
    
    <!-- Arms reaching upward -->
    <ellipse cx="-30" cy="0" rx="8" ry="50" fill="#000000" transform="rotate(-45)"/>
    <ellipse cx="30" cy="0" rx="8" ry="50" fill="#000000" transform="rotate(-35)"/>
    
    <!-- Hands reaching for light -->
    <ellipse cx="-50" cy="-40" rx="6" ry="15" fill="#000000" transform="rotate(-60)"/>
    <ellipse cx="50" cy="-50" rx="6" ry="15" fill="#000000" transform="rotate(-50)"/>
    
    <!-- Fingers straining upward -->
    <line x1="-55" y1="-50" x2="-58" y2="-65" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <line x1="-50" y1="-52" x2="-52" y2="-67" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <line x1="-45" y1="-54" x2="-46" y2="-69" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="-60" x2="46" y2="-75" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="-58" x2="52" y2="-73" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="-56" x2="58" y2="-71" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Legs positioned for climbing -->
    <ellipse cx="-15" cy="80" rx="10" ry="40" fill="#000000" transform="rotate(10)"/>
    <ellipse cx="15" cy="90" rx="10" ry="40" fill="#000000" transform="rotate(-10)"/>
  </g>
  
  <!-- Additional swirling textures around person -->
  <g opacity="0.4">
    <path d="M 800 700 Q 900 750, 1000 700 Q 1100 650, 1120 750" stroke="#555" fill="none" stroke-width="2"/>
    <path d="M 850 750 Q 950 800, 1050 750 Q 1150 700, 1170 800" stroke="#555" fill="none" stroke-width="2"/>
    <path d="M 900 800 Q 1000 850, 1100 800 Q 1200 750, 1220 850" stroke="#555" fill="none" stroke-width="2"/>
  </g>
  
  <!-- Text overlay area (for title if needed) -->
  <rect x="0" y="0" width="1920" height="300" fill="url(#texture)" opacity="0.1"/>
</svg>
