<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Optimized Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .banner {
            width: 1584px;
            height: 396px;
            background: #000000;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 40px 0 360px;
            overflow: hidden;
        }
        
        /* Subtle background effects */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }
        
        /* Main Container */
        .main-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            position: relative;
            z-index: 2;
            padding-left: 0;
        }
        
        /* Left Section - Text Content */
        .text-section {
            flex: 0 0 460px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 0;
        }
        
        .featured-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 14px;
            border: 1.5px solid #ffffff;
            background: transparent;
            color: #ffffff;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        
        .featured-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        
        .main-heading {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .heading-line {
            font-size: 40px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            font-family: 'Poppins', sans-serif;
        }
        
        .heading-line.white {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        .heading-line.teal {
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }
        
        .heading-line .bold-word {
            font-weight: 900;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }
        
        .services {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        
        .service-btn {
            padding: 11px 24px;
            background: #ffffff;
            color: #000000;
            font-size: 14px;
            font-weight: 800;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }
        
        .service-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(255, 255, 255, 0.3);
            background: #f5f5f5;
        }
        
        .social-proof {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        
        .proof-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .impressions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .impressions-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
        }
        
        .impressions-number {
            font-weight: 900;
            font-size: 17px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        
        .x-logo {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 12px;
            color: #000000;
            margin-left: 4px;
        }
        
        .clients-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
        }
        
        .clients-number {
            color: #ffffff;
            font-weight: 900;
            font-size: 20px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .clients-label, .impressions-label {
            font-weight: 600;
        }
        
        .divider {
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }
        
        /* Right Section - Diagrams */
        .diagram-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: 0;
            min-width: 0;
            max-width: 100%;
        }
        
        .diagram-container {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-shrink: 0;
            justify-content: center;
        }
        
        .graph-wrapper {
            position: relative;
            width: 230px;
            height: 230px;
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 0.2),
                inset 0 0 40px rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }
        
        .graph-wrapper.complex {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 
                0 0 35px rgba(255, 255, 255, 0.15),
                inset 0 0 35px rgba(255, 255, 255, 0.03);
        }
        
        .graph-label {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            white-space: nowrap;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }
        
        .graph-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .axis {
            stroke: #ffffff;
            stroke-width: 3;
            fill: none;
            opacity: 1;
        }
        
        .arrow {
            fill: #ffffff;
            opacity: 1;
        }
        
        .complex-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.5));
        }
        
        .simple-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 7;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6));
            animation: path-glow 2.5s ease-in-out infinite alternate;
        }
        
        @keyframes path-glow {
            from { filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6)); }
            to { filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.8)); }
        }
        
        .start-point {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
        }
        
        .end-point {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.8));
            animation: point-pulse 2s ease-in-out infinite;
        }
        
        @keyframes point-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .arrow-divider {
            font-size: 45px;
            color: #ffffff;
            font-weight: 300;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            animation: arrow-slide 2.5s ease-in-out infinite;
            margin-top: 20px;
            flex-shrink: 0;
        }
        
        @keyframes arrow-slide {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(6px); }
        }
        
        /* Download button - outside banner */
        .download-section {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }
        
        .download-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 18px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
            background: #f5f5f5;
        }
        
        @media (max-width: 1700px) {
            .banner {
                width: 100%;
                max-width: 1584px;
                height: auto;
                min-height: 396px;
                aspect-ratio: 4 / 1;
            }
        }
        
        @media (max-width: 1200px) {
            .banner {
                flex-direction: column;
                padding: 30px 20px;
                gap: 30px;
                height: auto;
            }
            
            .main-container {
                flex-direction: column;
                gap: 30px;
            }
            
            .text-section {
                flex: 1;
                text-align: center;
            }
            
            .heading-line {
                font-size: 28px;
            }
            
            .diagram-section {
                padding-left: 0;
            }
            
            .graph-wrapper {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="bannerContainer">
        <div class="main-container">
            <!-- Left Section - Text -->
            <div class="text-section">
                <div class="main-heading">
                    <div class="heading-line white">Helping <span class="bold-word">Founders</span> & <span class="bold-word">Coaches</span></div>
                    <div class="heading-line teal"><span class="bold-word">Build</span> and <span class="bold-word">Monetize</span> their</div>
                    <div class="heading-line white">personal brand on <span class="bold-word">X/LinkedIn</span></div>
                </div>
                
                <div class="services">
                    <button class="service-btn">Ghostwriting services</button>
                    <button class="service-btn">Brand Consulting</button>
                </div>
                
                <div class="social-proof">
                    <div class="proof-row">
                        <div class="clients-stat">
                            <span class="clients-label">Trusted by</span>
                            <span class="clients-number">+25</span>
                            <span class="clients-label">clients</span>
                        </div>
                        <span class="divider">•</span>
                        <div class="impressions">
                            <span class="impressions-number">6.1M+</span>
                            <span class="impressions-label">Impressions on</span>
                            <span class="x-logo">𝕏</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Section - Diagrams -->
            <div class="diagram-section">
                <div class="diagram-container">
                    <!-- Complex Path -->
                    <div style="position: relative;">
                        <div class="graph-label">❌ WITHOUT STRATEGY</div>
                        <div class="graph-wrapper complex">
                            <div class="graph-container">
                                <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                                    <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                    <polygon class="arrow" points="50,50 45,60 55,60"/>
                                    <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                    <polygon class="arrow" points="350,350 340,345 340,355"/>
                                    <path class="complex-path" d="M 60 340 
                                        Q 80 320, 100 330
                                        Q 120 340, 110 300
                                        Q 100 260, 130 280
                                        Q 160 300, 150 250
                                        Q 140 200, 170 220
                                        Q 200 240, 190 200
                                        Q 180 160, 210 180
                                        Q 240 200, 230 150
                                        Q 220 100, 250 120
                                        Q 280 140, 270 100
                                        Q 260 60, 290 80
                                        Q 320 100, 310 70
                                        Q 300 50, 320 60
                                        Q 340 70, 330 80"/>
                                    <circle class="start-point" cx="60" cy="340" r="7"/>
                                    <circle class="end-point" cx="330" cy="80" r="7"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Arrow -->
                    <div class="arrow-divider">→</div>
                    
                    <!-- Simple Path -->
                    <div style="position: relative;">
                        <div class="graph-label">✅ WITH GHOSTWRITER</div>
                        <div class="graph-wrapper">
                            <div class="graph-container">
                                <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                                    <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                    <polygon class="arrow" points="50,50 45,60 55,60"/>
                                    <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                    <polygon class="arrow" points="350,350 340,345 340,355"/>
                                    <line class="simple-path" x1="60" y1="340" x2="330" y2="80"/>
                                    <circle class="start-point" cx="60" cy="340" r="7"/>
                                    <circle class="end-point" cx="330" cy="80" r="9"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Featured Button - Top Left Corner -->
        <button class="featured-btn">SEE WHAT'S FEATURED</button>
    </div>
    
    <!-- Download Button - Outside banner so it won't appear in JPEG -->
    <div class="download-section">
        <button class="download-btn" onclick="downloadAsJPEG()">Download JPEG</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadAsJPEG() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Generating...';
            button.disabled = true;
            
            try {
                const container = document.getElementById('bannerContainer');
                
                const canvas = await html2canvas(container, {
                    backgroundColor: '#000000',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    width: 1584,
                    height: 396
                });
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'linkedin-optimized-banner.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    button.textContent = originalText;
                    button.disabled = false;
                }, 'image/jpeg', 0.95);
                
            } catch (error) {
                console.error('Error generating JPEG:', error);
                alert('Error generating JPEG. Please try right-clicking and saving the image manually.');
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.querySelector('.banner');
            banner.style.opacity = '0';
            banner.style.transform = 'scale(0.97)';
            banner.style.transition = 'all 0.8s ease';
            
            setTimeout(() => {
                banner.style.opacity = '1';
                banner.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body>
</html>
