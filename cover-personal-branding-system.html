<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Personal Branding System Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .cover {
            width: 400px;
            height: 600px;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 40px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        .cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 20%, rgba(196, 154, 75, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .cover-content {
            position: relative;
            z-index: 1;
        }

        .cover-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c49a4b 0%, #d4a574 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(196, 154, 75, 0.4), 0 0 60px rgba(196, 154, 75, 0.2);
        }

        .cover-logo-text {
            font-size: 36px;
            font-weight: 900;
            color: #000000;
            letter-spacing: -0.02em;
        }

        .cover-title {
            font-size: 48px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.05;
            margin-bottom: 24px;
            letter-spacing: -0.03em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .cover-stats {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
            padding: 20px;
            background: rgba(196, 154, 75, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(196, 154, 75, 0.15);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(196, 154, 75, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .stat-text {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .cover-subtitle {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .cover-author {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        @media print {
            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="cover-content">
            <div class="cover-logo">
                <div class="cover-logo-text">PB</div>
            </div>
            <h1 class="cover-title">THE PERSONAL<br>BRANDING<br>SYSTEM</h1>
            <div class="cover-stats">
                <div class="stat-item">
                    <div class="stat-icon">📈</div>
                    <div class="stat-text">LinkedIn: 12K followers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">🐦</div>
                    <div class="stat-text">X: 2.7K followers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">📧</div>
                    <div class="stat-text">Newsletter: 600 subscribers</div>
                </div>
            </div>
            <p class="cover-subtitle">Step-by-step process to build your personal brand from scratch</p>
        </div>
        <div class="cover-author">Andrei Lucian</div>
    </div>
</body>
</html>
