<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostwriter Viral LinkedIn Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #000000 0%, #001a1f 30%, #003d47 70%, #000000 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            overflow: hidden;
        }
        
        /* Animated background effects */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 40%, rgba(0, 217, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(0, 217, 255, 0.1) 0%, transparent 40%),
                linear-gradient(90deg, transparent 0%, rgba(0, 217, 255, 0.05) 50%, transparent 100%);
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* Glowing grid pattern */
        .banner::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            opacity: 0.5;
        }
        
        /* Left Content Section */
        .content-section {
            flex: 0 0 520px;
            position: relative;
            z-index: 2;
        }
        
        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.2), rgba(0, 217, 255, 0.1));
            border: 1.5px solid #00d9ff;
            border-radius: 20px;
            color: #00d9ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
            animation: badge-glow 3s ease-in-out infinite;
        }
        
        @keyframes badge-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 217, 255, 0.4); }
            50% { box-shadow: 0 0 30px rgba(0, 217, 255, 0.6); }
        }
        
        .main-heading {
            margin-bottom: 16px;
        }
        
        .heading-line {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1.2px;
            font-family: 'Poppins', sans-serif;
        }
        
        .heading-line.white {
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        
        .heading-line.teal {
            color: #00d9ff;
            text-shadow: 0 0 25px rgba(0, 217, 255, 0.6);
            background: linear-gradient(135deg, #00d9ff 0%, #00e5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .social-proof {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }
        
        .proof-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .proof-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .proof-number {
            color: #00d9ff;
            font-weight: 900;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        .proof-label {
            opacity: 0.9;
        }
        
        .divider {
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            padding: 0 4px;
        }
        
        .highlight-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.2), rgba(0, 217, 255, 0.1));
            border: 1.5px solid #00d9ff;
            border-radius: 6px;
            color: #00d9ff;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }
        
        /* Visual Container */
        .visual-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            position: relative;
            z-index: 2;
            padding: 0 30px;
        }
        
        .visual-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .label {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.95;
        }
        
        .graph-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            background: rgba(0, 217, 255, 0.05);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 
                0 0 30px rgba(0, 217, 255, 0.2),
                inset 0 0 30px rgba(0, 217, 255, 0.05);
        }
        
        .graph-wrapper.complex {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.02);
        }
        
        .graph-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .axis {
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
            opacity: 0.9;
        }
        
        .arrow {
            fill: #ffffff;
            opacity: 0.9;
        }
        
        .complex-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }
        
        .simple-path {
            fill: none;
            stroke: url(#tealGradient);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.6));
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.6)); }
            to { filter: drop-shadow(0 0 25px rgba(0, 217, 255, 0.9)); }
        }
        
        .start-point {
            fill: #90ee90;
            stroke: #ffffff;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 8px rgba(144, 238, 144, 0.6));
        }
        
        .end-point {
            fill: #00d9ff;
            stroke: #ffffff;
            stroke-width: 3;
            filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.8));
            animation: pulse-dot 2s ease-in-out infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        
        /* Arrow Divider */
        .arrow-divider {
            position: relative;
            margin-top: 40px;
        }
        
        .arrow-icon {
            font-size: 48px;
            color: #00d9ff;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
            animation: slide 2s ease-in-out infinite;
        }
        
        @keyframes slide {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }
        
        /* Download button */
        .download-section {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #00d9ff 0%, #00b8d9 100%);
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.4);
            text-transform: uppercase;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 217, 255, 0.6);
            background: linear-gradient(135deg, #00e5ff 0%, #00c9e8 100%);
        }
        
        @media (max-width: 1700px) {
            .banner {
                width: 100%;
                max-width: 1584px;
                height: auto;
                min-height: 396px;
                aspect-ratio: 4 / 1;
            }
        }
        
        @media (max-width: 1200px) {
            .banner {
                flex-direction: column;
                padding: 30px 20px;
                gap: 30px;
                height: auto;
            }
            
            .content-section {
                flex: 1;
                text-align: center;
            }
            
            .heading-line {
                font-size: 32px;
            }
            
            .visual-container {
                gap: 30px;
            }
            
            .graph-wrapper {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="bannerContainer">
        <!-- Left Content -->
        <div class="content-section">
            <div class="badge">⚡ Proven Results</div>
            
            <div class="main-heading">
                <div class="heading-line white">Stop Posting</div>
                <div class="heading-line teal">Random Content</div>
                <div class="heading-line white">Start Growing</div>
                <div class="heading-line teal">With Strategy</div>
            </div>
            
            <div class="social-proof">
                <div class="proof-row">
                    <div class="proof-item">
                        <span class="proof-label">Trusted by</span>
                        <span class="proof-number">+25</span>
                        <span class="proof-label">clients</span>
                    </div>
                </div>
                <div class="proof-row">
                    <div class="highlight-badge">
                        <span>⚡</span>
                        <span class="proof-number">800</span>
                        <span class="proof-label">followers in 24h</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Visual Container -->
        <div class="visual-container">
            <!-- Complex Path Section -->
            <div class="visual-section">
                <div class="label">❌ Without Strategy</div>
                <div class="graph-wrapper complex">
                    <div class="graph-container">
                        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                            <!-- Y-axis -->
                            <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                            <polygon class="arrow" points="50,50 45,60 55,60"/>
                            
                            <!-- X-axis -->
                            <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                            <polygon class="arrow" points="350,350 340,345 340,355"/>
                            
                            <!-- Complex winding path -->
                            <path class="complex-path" d="M 60 340 
                                Q 80 320, 100 330
                                Q 120 340, 110 300
                                Q 100 260, 130 280
                                Q 160 300, 150 250
                                Q 140 200, 170 220
                                Q 200 240, 190 200
                                Q 180 160, 210 180
                                Q 240 200, 230 150
                                Q 220 100, 250 120
                                Q 280 140, 270 100
                                Q 260 60, 290 80
                                Q 320 100, 310 70
                                Q 300 50, 320 60
                                Q 340 70, 330 80"/>
                            
                            <!-- Start point -->
                            <circle class="start-point" cx="60" cy="340" r="7"/>
                            
                            <!-- End point -->
                            <circle class="end-point" cx="330" cy="80" r="7"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Arrow Divider -->
            <div class="arrow-divider">
                <div class="arrow-icon">→</div>
            </div>
            
            <!-- Simple Path Section -->
            <div class="visual-section">
                <div class="label">✅ With Ghostwriter</div>
                <div class="graph-wrapper">
                    <div class="graph-container">
                        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                            <!-- Gradient definition -->
                            <defs>
                                <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            
                            <!-- Y-axis -->
                            <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                            <polygon class="arrow" points="50,50 45,60 55,60"/>
                            
                            <!-- X-axis -->
                            <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                            <polygon class="arrow" points="350,350 340,345 340,355"/>
                            
                            <!-- Simple straight path -->
                            <line class="simple-path" x1="60" y1="340" x2="330" y2="80"/>
                            
                            <!-- Start point -->
                            <circle class="start-point" cx="60" cy="340" r="7"/>
                            
                            <!-- End point -->
                            <circle class="end-point" cx="330" cy="80" r="8"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Download Button -->
        <div class="download-section">
            <button class="download-btn" onclick="downloadAsJPEG()">Download JPEG</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadAsJPEG() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Generating...';
            button.disabled = true;
            
            try {
                const container = document.getElementById('bannerContainer');
                
                // Use html2canvas to capture the banner
                const canvas = await html2canvas(container, {
                    backgroundColor: '#000000',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    width: 1584,
                    height: 396
                });
                
                // Convert to JPEG
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ghostwriter-viral-banner.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    button.textContent = originalText;
                    button.disabled = false;
                }, 'image/jpeg', 0.95);
                
            } catch (error) {
                console.error('Error generating JPEG:', error);
                alert('Error generating JPEG. Please try right-clicking and saving the image manually.');
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        // Add fade-in animation
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.querySelector('.banner');
            banner.style.opacity = '0';
            banner.style.transform = 'scale(0.95)';
            banner.style.transition = 'all 0.8s ease';
            
            setTimeout(() => {
                banner.style.opacity = '1';
                banner.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body>
</html>
