<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostwriter Growth Visual - LinkedIn Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .banner {
            width: 1584px;
            height: 396px;
            background: #000000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            overflow: hidden;
        }
        
        /* Background decorative elements */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 217, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }
        
        /* Header Section */
        .header-section {
            flex: 0 0 auto;
            max-width: 380px;
            position: relative;
            z-index: 2;
        }
        
        .header-text {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: -0.3px;
            margin-bottom: 0;
        }
        
        .header-text .line1 {
            display: block;
            margin-bottom: 6px;
        }
        
        .header-text .line2 {
            display: block;
            color: #00d9ff;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }
        
        /* Visual Container */
        .visual-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }
        
        .visual-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .label {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 0.3px;
            opacity: 0.9;
        }
        
        .graph-container {
            width: 220px;
            height: 220px;
            position: relative;
        }
        
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .axis {
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
            opacity: 0.85;
        }
        
        .arrow {
            fill: #ffffff;
            opacity: 0.85;
        }
        
        .complex-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.15));
        }
        
        .simple-path {
            fill: none;
            stroke: #00d9ff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.4));
        }
        
        .start-point {
            fill: #90ee90;
            stroke: #ffffff;
            stroke-width: 2;
            filter: drop-shadow(0 0 6px rgba(144, 238, 144, 0.4));
        }
        
        .end-point {
            fill: #00d9ff;
            stroke: #ffffff;
            stroke-width: 2;
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.5));
        }
        
        /* Arrow between graphs */
        .arrow-divider {
            color: #00d9ff;
            font-size: 32px;
            font-weight: 300;
            opacity: 0.7;
            margin-top: 30px;
        }
        
        /* Download button */
        .download-section {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #00d9ff 0%, #00b8d9 100%);
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            box-shadow: 0 3px 15px rgba(0, 217, 255, 0.3);
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.5);
            background: linear-gradient(135deg, #00e5ff 0%, #00c9e8 100%);
        }
        
        .download-btn:active {
            transform: translateY(0);
        }
        
        @media (max-width: 1700px) {
            .banner {
                width: 100%;
                max-width: 1584px;
                height: auto;
                min-height: 396px;
                aspect-ratio: 4 / 1;
            }
        }
        
        @media (max-width: 1200px) {
            .banner {
                flex-direction: column;
                padding: 30px 20px;
                gap: 30px;
                height: auto;
            }
            
            .header-section {
                max-width: 100%;
                text-align: center;
            }
            
            .header-text {
                font-size: 20px;
            }
            
            .visual-container {
                gap: 40px;
            }
            
            .graph-container {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="bannerContainer">
        <!-- Header -->
        <div class="header-section">
            <div class="header-text">
                <span class="line1">Stop struggling with content.</span>
                <span class="line2">Start growing with a ghostwriter.</span>
            </div>
        </div>
        
        <!-- Visual Container -->
        <div class="visual-container">
            <!-- Complex Path Section -->
            <div class="visual-section">
                <div class="label">Go from this:</div>
                <div class="graph-container">
                    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <!-- Y-axis -->
                        <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                        <polygon class="arrow" points="50,50 45,60 55,60"/>
                        
                        <!-- X-axis -->
                        <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                        <polygon class="arrow" points="350,350 340,345 340,355"/>
                        
                        <!-- Complex winding path -->
                        <path class="complex-path" d="M 60 340 
                            Q 80 320, 100 330
                            Q 120 340, 110 300
                            Q 100 260, 130 280
                            Q 160 300, 150 250
                            Q 140 200, 170 220
                            Q 200 240, 190 200
                            Q 180 160, 210 180
                            Q 240 200, 230 150
                            Q 220 100, 250 120
                            Q 280 140, 270 100
                            Q 260 60, 290 80
                            Q 320 100, 310 70
                            Q 300 50, 320 60
                            Q 340 70, 330 80"/>
                        
                        <!-- Start point -->
                        <circle class="start-point" cx="60" cy="340" r="6"/>
                        
                        <!-- End point -->
                        <circle class="end-point" cx="330" cy="80" r="6"/>
                    </svg>
                </div>
            </div>
            
            <!-- Arrow Divider -->
            <div class="arrow-divider">→</div>
            
            <!-- Simple Path Section -->
            <div class="visual-section">
                <div class="label">to this:</div>
                <div class="graph-container">
                    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <!-- Y-axis -->
                        <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                        <polygon class="arrow" points="50,50 45,60 55,60"/>
                        
                        <!-- X-axis -->
                        <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                        <polygon class="arrow" points="350,350 340,345 340,355"/>
                        
                        <!-- Simple straight path -->
                        <line class="simple-path" x1="60" y1="340" x2="330" y2="80"/>
                        
                        <!-- Start point -->
                        <circle class="start-point" cx="60" cy="340" r="6"/>
                        
                        <!-- End point -->
                        <circle class="end-point" cx="330" cy="80" r="6"/>
                    </svg>
                </div>
            </div>
        </div>
        
        <!-- Download Button -->
        <div class="download-section">
            <button class="download-btn" onclick="downloadAsJPEG()">Download JPEG</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadAsJPEG() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Generating...';
            button.disabled = true;
            
            try {
                const container = document.getElementById('bannerContainer');
                
                // Use html2canvas to capture the banner
                const canvas = await html2canvas(container, {
                    backgroundColor: '#000000',
                    scale: 2, // Higher quality
                    logging: false,
                    useCORS: true,
                    width: 1584,
                    height: 396
                });
                
                // Convert to JPEG
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ghostwriter-growth-linkedin-banner.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    button.textContent = originalText;
                    button.disabled = false;
                }, 'image/jpeg', 0.95); // 95% quality
                
            } catch (error) {
                console.error('Error generating JPEG:', error);
                alert('Error generating JPEG. Please try right-clicking and saving the image manually.');
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        // Add fade-in animation
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.querySelector('.banner');
            banner.style.opacity = '0';
            banner.style.transform = 'translateY(10px)';
            banner.style.transition = 'all 0.6s ease';
            
            setTimeout(() => {
                banner.style.opacity = '1';
                banner.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
