<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Professional Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .banner {
            width: 1584px;
            height: 396px;
            background: #000000;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 40px 0 320px;
            overflow: hidden;
        }
        
        /* Subtle background pattern */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.5;
        }
        
        /* Main Container */
        .main-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            position: relative;
            z-index: 2;
        }
        
        /* Left Section - Text */
        .text-section {
            flex: 0 0 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .featured-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            z-index: 10;
        }
        
        .main-heading {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .heading-line {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -1px;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }
        
        .heading-line .highlight {
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .services {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        
        .service-btn {
            padding: 10px 22px;
            background: #ffffff;
            color: #000000;
            font-size: 13px;
            font-weight: 800;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }
        
        .service-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }
        
        .social-proof {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 6px;
        }
        
        .proof-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }
        
        .proof-number {
            font-weight: 900;
            font-size: 18px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .divider {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }
        
        .x-logo {
            width: 18px;
            height: 18px;
            background: #ffffff;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            color: #000000;
            margin-left: 4px;
        }
        
        /* Right Section - Diagrams */
        .diagram-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }
        
        .diagram-container {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        
        .graph-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.15),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
        }
        
        .graph-wrapper.complex {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
        }
        
        .graph-label {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }
        
        .graph-container {
            width: 100%;
            height: 100%;
        }
        
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .axis {
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
            opacity: 0.8;
        }
        
        .arrow {
            fill: #ffffff;
            opacity: 0.8;
        }
        
        .complex-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .simple-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }
        
        .start-point {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1.5;
        }
        
        .end-point {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
        }
        
        .arrow-divider {
            font-size: 36px;
            color: #ffffff;
            font-weight: 300;
            opacity: 0.8;
            margin-top: 15px;
        }
        
        /* Download button */
        .download-section {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }
        
        .download-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
            background: #f5f5f5;
        }
        
        @media (max-width: 1700px) {
            .banner {
                width: 100%;
                max-width: 1584px;
                height: auto;
                min-height: 396px;
                aspect-ratio: 4 / 1;
            }
        }
        
        @media (max-width: 1200px) {
            .banner {
                flex-direction: column;
                padding: 30px 20px;
                gap: 30px;
                height: auto;
            }
            
            .main-container {
                flex-direction: column;
                gap: 30px;
            }
            
            .text-section {
                flex: 1;
                text-align: center;
            }
            
            .heading-line {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="bannerContainer">
        <div class="main-container">
            <!-- Left Section - Text -->
            <div class="text-section">
                <div class="main-heading">
                    <div class="heading-line">Helping <span class="highlight">Founders</span> & <span class="highlight">Coaches</span></div>
                    <div class="heading-line"><span class="highlight">Build</span> and <span class="highlight">Monetize</span> their</div>
                    <div class="heading-line">personal brand on <span class="highlight">X/LinkedIn</span></div>
                </div>
                
                <div class="services">
                    <button class="service-btn">Ghostwriting services</button>
                    <button class="service-btn">Brand Consulting</button>
                </div>
                
                <div class="social-proof">
                    <div class="proof-item">
                        <span>Trusted by</span>
                        <span class="proof-number">+25</span>
                        <span>clients</span>
                    </div>
                    <span class="divider">•</span>
                    <div class="proof-item">
                        <span class="proof-number">6.1M+</span>
                        <span>Impressions on</span>
                        <span class="x-logo">𝕏</span>
                    </div>
                </div>
            </div>
            
            <!-- Right Section - Diagrams -->
            <div class="diagram-section">
                <div class="diagram-container">
                    <!-- Complex Path -->
                    <div style="position: relative;">
                        <div class="graph-label">❌ WITHOUT STRATEGY</div>
                        <div class="graph-wrapper complex">
                            <div class="graph-container">
                                <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                                    <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                    <polygon class="arrow" points="50,50 45,60 55,60"/>
                                    <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                    <polygon class="arrow" points="350,350 340,345 340,355"/>
                                    <path class="complex-path" d="M 60 340 
                                        Q 80 320, 100 330
                                        Q 120 340, 110 300
                                        Q 100 260, 130 280
                                        Q 160 300, 150 250
                                        Q 140 200, 170 220
                                        Q 200 240, 190 200
                                        Q 180 160, 210 180
                                        Q 240 200, 230 150
                                        Q 220 100, 250 120
                                        Q 280 140, 270 100
                                        Q 260 60, 290 80
                                        Q 320 100, 310 70
                                        Q 300 50, 320 60
                                        Q 340 70, 330 80"/>
                                    <circle class="start-point" cx="60" cy="340" r="6"/>
                                    <circle class="end-point" cx="330" cy="80" r="6"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Arrow -->
                    <div class="arrow-divider">→</div>
                    
                    <!-- Simple Path -->
                    <div style="position: relative;">
                        <div class="graph-label">✅ WITH GHOSTWRITER</div>
                        <div class="graph-wrapper">
                            <div class="graph-container">
                                <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                                    <line class="axis" x1="50" y1="350" x2="50" y2="50"/>
                                    <polygon class="arrow" points="50,50 45,60 55,60"/>
                                    <line class="axis" x1="50" y1="350" x2="350" y2="350"/>
                                    <polygon class="arrow" points="350,350 340,345 340,355"/>
                                    <line class="simple-path" x1="60" y1="340" x2="330" y2="80"/>
                                    <circle class="start-point" cx="60" cy="340" r="6"/>
                                    <circle class="end-point" cx="330" cy="80" r="7"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Featured Button -->
        <button class="featured-btn">SEE WHAT'S FEATURED</button>
    </div>
    
    <!-- Download Button -->
    <div class="download-section">
        <button class="download-btn" onclick="downloadAsJPEG()">Download JPEG</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadAsJPEG() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Generating...';
            button.disabled = true;
            
            try {
                const container = document.getElementById('bannerContainer');
                
                const canvas = await html2canvas(container, {
                    backgroundColor: '#000000',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    width: 1584,
                    height: 396
                });
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'linkedin-professional-banner.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    button.textContent = originalText;
                    button.disabled = false;
                }, 'image/jpeg', 0.95);
                
            } catch (error) {
                console.error('Error generating JPEG:', error);
                alert('Error generating JPEG. Please try right-clicking and saving the image manually.');
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.querySelector('.banner');
            banner.style.opacity = '0';
            banner.style.transition = 'opacity 0.6s ease';
            
            setTimeout(() => {
                banner.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
